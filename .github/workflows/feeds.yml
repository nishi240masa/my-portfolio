name: Refresh external feeds

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Fetch feeds
        env:
          ZENN_USER: ${{ vars.ZENN_USER || secrets.ZENN_USER }}
          QIITA_USER: ${{ vars.QIITA_USER || secrets.QIITA_USER }}
          # GitHub は `GITHUB_` で始まる secret / variable 名を禁止しているため、
          # 既定はリポジトリ owner。別アカウントを出したい場合のみ vars.FEEDS_GITHUB_USER で上書き
          GITHUB_USER: ${{ vars.FEEDS_GITHUB_USER || github.repository_owner }}
          USER_HANDLE: ${{ vars.USER_HANDLE || secrets.USER_HANDLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-feeds.mjs

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain data/feeds.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feeds.json
            git commit -m "chore(data): refresh feeds.json"
            git push
          else
            echo "No changes to data/feeds.json"
          fi
