# Dependabot version updates
# - PR は develop 向け (main へは release PR 経由)
# - noise 抑制: minor/patch は ecosystem ごとに 1 PR に group 化、open PR 数も絞る
# - フレームワーク (Next / React / MUI / next-auth) の major は別 ticket で手動判断するため ignore
# - security updates (Dependabot alerts 起点) は本設定の group / ignore とは別に個別 PR で届く
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm' # yarn v1 (yarn.lock) もこの ecosystem で扱われる
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    versioning-strategy: 'auto'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@mui/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next-auth'
        update-types: ['version-update:semver-major']
      # @types/node は実行環境 (.nvmrc = Node 24) の major に合わせる。Node 本体の major を上げる時に手動で追従
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react-hooks v6+ は flat config / 新ルール (React Compiler 系) への移行が必要で単純 bump では CI が落ちる。
      # 移行 ticket で手動対応するまで major を ignore
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
      # vercel は exact 47.0.4 固定: @cloudflare/next-on-pages の peer が vercel >=30 <=47.0.4 のため patch も含め全 update を ignore
      # (update-types 省略 = 全 update type)。解除条件: next-on-pages の peer 上限が上がる / next-on-pages から移行した時
      - dependency-name: 'vercel'
